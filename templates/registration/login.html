{% extends "base.html" %}
{% load static %}
{% block title %}Вход — BoxCRM{% endblock %}

{% block content %}
<div class="login-wrap">
  <div class="card login-card border-0 shadow-sm">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <img src="{% static 'icon/boxcrm-logo.png' %}" alt="BoxCRM"
             class="login-logo" width="170" height="56">
        <h1 class="h4 mt-3 mb-1">Вход в BoxCRM</h1>
        <p class="text-muted mb-0">Учёт товаров и клиентов</p>
      </div>

      {% if form.errors %}
        <div class="alert alert-danger" role="alert">Неверный логин или пароль.</div>
      {% endif %}

      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-3">
          <label class="form-label" for="id_username">Логин</label>
          <input class="form-control" id="id_username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label" for="id_password">Пароль</label>
          <input class="form-control" id="id_password" name="password" type="password"
                 autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Войти</button>
      </form>

      <p class="text-muted small mt-3 mb-0">Нет доступа? Обратитесь к владельцу магазина.</p>
    </div>
  </div>
</div>
{% endblock %}
